name: Weekly Bible Study Plan (Generate)

on:
  # Auto-schedule intentionally disabled: generation now runs on a local PC
  # (via Task Scheduler) with a residential IP, since YouTube blocks
  # unauthenticated caption requests from GitHub-hosted runners' datacenter
  # IPs. This workflow is kept as a manual fallback only — e.g. if the local
  # PC is offline, or YOUTUBE_COOKIES happens to still be valid.
  # schedule:
  #   - cron: '0 4 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # so the final step can commit output/week-*.json back to the repo

jobs:
  build-study-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Deno (JS runtime yt-dlp needs to solve YouTube's "n" challenge)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write YouTube cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: printf '%s\n' "$YOUTUBE_COOKIES" > youtube_cookies.txt

      - name: Generate this week's Monday-Saturday plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_COOKIES_FILE: youtube_cookies.txt
        run: python generate_study_plan.py

      - name: Clean up cookies file
        if: always()
        run: rm -f youtube_cookies.txt

      - name: Commit generated plan back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/week-*.json
          git commit -m "Add week's study plan $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push
