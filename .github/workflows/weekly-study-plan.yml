name: Weekly Bible Study Plan (Generate)

on:
  schedule:
    # Sunday night 10:00 PM Mountain Time = 04:00 UTC Monday.
    # Extra Monday/Tuesday slots are automatic retries: the script exits
    # early ("nothing to do") once this week's plan exists, so the retries
    # only matter if an earlier run failed (YouTube IP block, captions not
    # processed yet, etc.).
    - cron: '0 4 * * 1'    # Mon 04:00 UTC (Sun 10 PM MDT)
    - cron: '0 7 * * 1'    # Mon 07:00 UTC (Mon 1 AM MDT)
    - cron: '0 11 * * 1'   # Mon 11:00 UTC (Mon 5 AM MDT) - before the 13:00 UTC daily send
    - cron: '0 4 * * 2'    # Tue 04:00 UTC last chance
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID or URL to use instead of auto-detecting the latest sermon"
        required: false
        default: ""
      force:
        description: "Regenerate even if this week's plan already exists"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write   # so the final step can commit output/week-*.json back to the repo

jobs:
  build-study-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Deno (JS runtime yt-dlp needs to solve YouTube's "n" challenge)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write YouTube cookies file (optional fallback)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > youtube_cookies.txt
          fi

      - name: Generate this week's Monday-Saturday plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES_FILE: youtube_cookies.txt
          YOUTUBE_VIDEO_ID: ${{ github.event.inputs.video_id }}
          FORCE_REGENERATE: ${{ github.event.inputs.force }}
        run: python generate_study_plan.py

      - name: Clean up cookies file
        if: always()
        run: rm -f youtube_cookies.txt

      - name: Commit generated plan back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/week-*.json output/latest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add week's study plan $(date +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          payload=$(printf '{"text":":x: Weekly Bible study plan generation failed (run #%s). Check the log or re-run manually with a video ID: %s"}' \
            "${{ github.run_number }}" "$RUN_URL")
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"
