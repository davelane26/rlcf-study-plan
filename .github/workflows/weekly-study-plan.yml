name: Weekly Bible Study Plan (Generate)

on:
  schedule:
    # Runs 10:00 PM Mountain Time on Sundays, after the sermon has posted.
    # GitHub Actions cron is in UTC; MT is UTC-7 (MDT) or UTC-6 (MST).
    # 10:00 PM MDT Sunday = 04:00 UTC Monday. Adjust by 1 hour during MST season.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build-study-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies file
        if: ${{ secrets.YOUTUBE_COOKIES != '' }}
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > youtube_cookies.txt

      - name: Generate this week's Monday-Saturday plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_COOKIES_FILE: youtube_cookies.txt
        run: python generate_study_plan.py

      - name: Clean up cookies file
        if: always()
        run: rm -f youtube_cookies.txt

      - name: Commit generated plan back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/week-*.json
          git commit -m "Add week's study plan $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push
